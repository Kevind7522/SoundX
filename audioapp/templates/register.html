<!DOCTYPE html>
<html>
<head>

<title>SoundX</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    font-family: 'Rubik', sans-serif !important;
}
body{

background:linear-gradient(135deg,#000,#b43ae4,#000);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.register-box{

width:450px;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 0 25px rgba(0,0,0,.4);

}

h2{

text-align:center;

margin-bottom:20px;

color:#b43ae4;

}

.btn-register{

width:100%;

background:#b43ae4;

color:white;

}

.btn-register:hover{

box-shadow:0 0 20px #b43ae4b9;
            border-width: 1px;
            border-color: #b43ae4b6;
            background:white;
            color:#b43ae4;

}
h1{
  text-align: center;
}

h1 span{
     color: #b43ae4;         
}
.form-control{
            border-width: 2px;
            box-shadow:0 0 10px rgba(0, 255, 255, 0.719);
}
label{
            padding-bottom: 5px;
        }
</style>

</head>

<body>

<div class="register-box">
<h1>Sound<span>X</span></h1>
<hr>
<h2>Create Account</h2>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm"
class="form-control"
required>

</div>

<button class="btn btn-register">

Register

</button>

</form>

<hr>

<p class="text-center">

Already Registered?

<a href="{% url 'login' %}">

Login

</a>

</p>

</div>

</body>

</html>
