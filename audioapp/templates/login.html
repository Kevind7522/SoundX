<!DOCTYPE html>
<html>
<head>
    <title>SoundX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        *{
    font-family: 'Rubik', sans-serif !important;
}
        body{
            background:linear-gradient(135deg,#000,#6a11cb,#000);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        h1{
            text-align: center;
        }

        h1 span{
            color: #6a11cb;         
        }

        .login-box{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 18px rgba(0, 255, 255, 0.719);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#6a11cb;
        }

        .btn-login{
            margin-top: 5px;
            width:100%;
            background:#6a11cb;
            color:white;
        }

        .btn-login:hover{
            box-shadow:0 0 20px #4e0f96b9;
            border-width: 1px;
            border-color: #4e0f96b6;
            background:white;
            color:#4d0f96;
        }
        label{
            padding-bottom: 5px;
        }
        .form-control{
            border-width: 2px;
            box-shadow:0 0 10px rgba(0, 255, 255, 0.719);
        }
    </style>

</head>
<body>
<div class="login-box">
<h1>Sound<span>X</span></h1>
<hr>
<h2>Login</h2>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Name</label>

<input type="text" name="name" placeholder="Enter your Name" class="form-control" required>

</div>

<div class="mb-3">

<label>Email</label>

<input type="email" name="email" placeholder="Enter your Email" class="form-control" required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password" name="password" placeholder="Enter your Password" class="form-control" required>

</div>

<button class="btn btn-login">

Login

</button>

</form>

<hr>

<p class="text-center">

New User?

<a href="{% url 'register' %}">

Sign Up

</a>

</p>

</div>

</body>
</html>
